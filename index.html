<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanskriti Kadam</title>
<style>
:root{--bg:#f6f3fb;--fg:#1c1a24;--muted:#6b6678;--card:rgba(255,255,255,.7);--line:rgba(60,40,120,.14);--a:#8b5cf6;--b:#ec4899;--c:#38bdf8;--blob:.45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b14;--fg:#f3f0fa;--muted:#a49fb5;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--blob:.5}}
:root[data-theme="dark"]{--bg:#0d0b14;--fg:#f3f0fa;--muted:#a49fb5;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--blob:.5}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:var(--blob);will-change:transform}
.b1{background:var(--a);top:-12vmax;left:-10vmax}
.b2{background:var(--b);bottom:-16vmax;right:-8vmax}
.b3{background:var(--c);top:30%;left:45%;width:30vmax;height:30vmax}
.spot{position:absolute;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.25),transparent 65%);left:0;top:0;will-change:transform}
.aurora{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,var(--a),transparent 30%,var(--b),transparent 60%,var(--c),transparent);opacity:calc(var(--blob)*.4);filter:blur(90px);animation:spin 45s linear infinite}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(circle 280px at var(--mx,50%) var(--my,50%),#000,transparent);mask-image:radial-gradient(circle 280px at var(--mx,50%) var(--my,50%),#000,transparent)}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.shapes{position:absolute;inset:0}
.shape{position:absolute;border:1.5px solid var(--line);will-change:transform}
.s1{width:120px;height:120px;border-radius:50%;top:14%;left:10%;animation:drift 14s ease-in-out infinite}
.s2{width:84px;height:84px;border-radius:22px;bottom:14%;left:16%;border-color:var(--a);opacity:.5;animation:drift 18s -4s ease-in-out infinite reverse}
.s3{width:170px;height:170px;border-radius:50%;top:20%;right:8%;border-style:dashed;animation:drift 22s -8s ease-in-out infinite}
.s4{width:26px;height:26px;border-radius:50%;bottom:24%;right:16%;background:var(--b);border:0;opacity:.5;animation:drift 12s -2s ease-in-out infinite}
.s5{width:14px;height:14px;border-radius:50%;top:38%;left:7%;background:var(--c);border:0;opacity:.6;animation:drift 10s -6s ease-in-out infinite}
main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 20px 48px;gap:26px}
.theme{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;backdrop-filter:blur(10px);font-size:18px}
.hero{position:relative;width:240px;height:240px;margin:50px 0 6px;animation:rise .8s both}

lid var(--bg);box-shadow:0 0 0 3px var(--a),0 20px 50px rgba(139,92,246,.35)}
.photo::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed var(--line);animation:spin 30s linear infinite}
.ico{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--fg);backdrop-filter:blur(10px);transition:transform .25s,background .25s,color .25s}
.ico svg{width:20px;height:20px}
.ico:hover{transform:translate(var(--x),var(--y)) scale(1.18);background:var(--a);color:#fff}
.i1{transform:translate(-112px,-65px);--x:-112px;--y:-65px}
.i2{transform:translate(0,-130px);--x:0px;--y:-130px}
.i3{transform:translate(112px,-65px);--x:112px;--y:-65px}
h1{font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.02em;text-align:center;animation:rise .8s .1s both}
h1 span{background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.links{width:min(420px,100%);display:flex;flex-direction:column;gap:12px;animation:rise .8s .2s both}
.pill{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);color:var(--fg);text-decoration:none;font-weight:600;transition:transform .2s,border-color .2s}
.pill svg{width:20px;height:20px}
.pill:hover{transform:translateY(-3px);border-color:var(--a)}
.pill em{margin-left:auto;font-style:normal;color:var(--muted)}
.fs{padding:18px;gap:14px;margin-top:16px;border-color:var(--a);background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(236,72,153,.14)),var(--card);box-shadow:0 22px 44px -12px rgba(139,92,246,.55),0 0 0 1px rgba(139,92,246,.25);animation:pop .7s .6s cubic-bezier(.2,1.5,.4,1) both,float 5s 1.4s ease-in-out infinite}
.fs:hover{box-shadow:0 30px 56px -12px rgba(236,72,153,.55),0 0 0 1px var(--a)}
@keyframes drift{50%{transform:translate(26px,-32px) rotate(45deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
.fs{--fsbg:#14111d;--fsfg:#f3f0fa;--fsmuted:#a49fb5;color:var(--fsfg);background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(236,72,153,.15)),var(--fsbg)}
.fs small{color:var(--fsmuted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fs{--fsbg:#f6f3fb;--fsfg:#1c1a24;--fsmuted:#6b6678}}
:root[data-theme="dark"] .fs{--fsbg:#f6f3fb;--fsfg:#1c1a24;--fsmuted:#6b6678}
.logo{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:800;letter-spacing:-.04em}
.fs b{display:block;font-size:1.05rem}
.fs small{color:var(--muted);font-weight:500}
.fs .go{margin-left:auto;font-weight:700;color:var(--a);white-space:nowrap;transition:transform .2s}
.fs:hover .go{transform:translateX(5px)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.8)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:250% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"><div class="aurora"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div><div class="shapes"><i class="shape s1"></i><i class="shape s2"></i><i class="shape s3"></i><i class="shape s4"></i><i class="shape s5"></i></div><div class="spot"></div><div class="grain"></div></div>
<button class="theme" id="theme" aria-label="Toggle light or dark theme">◐</button>
<main>
  <div class="hero">
    <div class="photo" role="img" aria-label="Portrait of Sanskriti Kadam"></div>
    <a class="ico i1" href="https://www.instagram.com/sanskriti_kadam_sk" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a>
    <a class="ico i2" href="https://www.linkedin.com/in/YOUR-LINKEDIN" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 11-.01 5 2.5 2.5 0 01.01-5zM3 9.75h4V21H3zM9.5 9.75h3.8v1.6h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-4.9c0-1.17-.02-2.67-1.63-2.67-1.63 0-1.88 1.27-1.88 2.58V21h-4z"/></svg></a>
    <a class="ico i3" href="https://www.youtube.com/@YOUR-CHANNEL" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg></a>
  </div>
  <h1><span>Sanskriti Kadam</span></h1>
  <nav class="links">
    
    
    
    <a class="pill fs" href="https://sanskriti1102.github.io/FabricSafar/" target="_blank" rel="noopener">
      <span class="logo">FS</span>
      <span><b>FabricSafar</b><small>Explore the journey</small></span>
      <span class="go">Learn more →</span>
    </a>
  </nav>
</main>
<script>
(function(){
var root=document.documentElement,btn=document.getElementById('theme');
try{var t=localStorage.getItem('theme');if(t)root.setAttribute('data-theme',t)}catch(e){}
btn.addEventListener('click',function(){
var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
var n=dark?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}});
var bl=document.querySelectorAll('.blob'),sp=document.querySelector('.spot'),bgEl=document.querySelector('.bg'),shp=document.querySelector('.shapes'),
tx=innerWidth/2,ty=innerHeight/2,cx=tx,cy=ty,k=[.06,-.08,.04];
addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY});
(function loop(){cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;
var dx=cx-innerWidth/2,dy=cy-innerHeight/2;
bl.forEach(function(b,i){b.style.transform='translate('+dx*k[i]*3+'px,'+dy*k[i]*3+'px)'});
sp.style.transform='translate('+cx+'px,'+cy+'px)';bgEl.style.setProperty('--mx',cx+'px');bgEl.style.setProperty('--my',cy+'px');shp.style.transform='translate('+(-dx*.04)+'px,'+(-dy*.04)+'px)';requestAnimationFrame(loop)})();
})();
</script>
</body>
